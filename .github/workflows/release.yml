name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle*"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          # The runner's default ANDROID_NDK_HOME points at a different NDK.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          # versionName must stay numeric for the in-app updater (v0.5.<n>).
          BASE="$(grep -oP '^val baseVersion = "\K[0-9]+(\.[0-9]+)?(?=")' app/build.gradle.kts)"
          if [ -z "$BASE" ]; then
            echo "::error::Could not read the base version from app/build.gradle.kts"
            exit 1
          fi
          NAME="${BASE}.${{ github.run_number }}"
          # Minutes since 2020-01-01 UTC: always increases and fits an Android versionCode.
          CODE="$(( ($(date -u +%s) - 1577836800) / 60 ))"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64. See CONTRIBUTING.md (Publishing a release)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. See CONTRIBUTING.md (Publishing a release)."
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleRelease \
            -PbuildNumber="${{ github.run_number }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed app-release.apk. Check the signing secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          mkdir -p dist
          mv "$APK" dist/Strike.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Strike ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Install **Strike.apk** on the head unit, or update from **Settings** in Strike.

            **Version:** `${{ steps.version.outputs.name }}` (code `${{ steps.version.outputs.code }}`)
          files: dist/Strike.apk
          draft: false
          prerelease: false
          make_latest: "true"
